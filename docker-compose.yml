# RecQL Playground Demo stack: databases + app containers
name: recql

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: recql
      POSTGRES_PASSWORD: recql
      POSTGRES_DB: recql
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${PG_PORT:-55435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recql -d recql"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - recql_pg_data:/var/lib/postgresql/data

  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23-faststart}
    hostname: recql-oracle
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PWD:-RecqlPass1}
      APP_USER: recql
      APP_USER_PASSWORD: ${ORACLE_PWD:-RecqlPass1}
    shm_size: ${ORACLE_SHM_SIZE:-1gb}
    volumes:
      - recql_oracle_data:/opt/oracle/oradata
      - ./docker/oracle/setup:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.7}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PWD:-RecqlRoot1}
      MYSQL_DATABASE: recql
      MYSQL_USER: recql
      MYSQL_PASSWORD: ${MARIADB_PWD:-recql}
    volumes:
      - recql_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongodb:
    image: mongodb/mongodb-atlas-local:8.2.0
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-RecqlTest1234!}"
      MSSQL_PID: "Developer"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-RecqlTest1234!}", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # RecQL app containers for each backend
  app-postgres:
    build: .
    image: recql-playground:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECQL_BACKEND: postgres
      RECQL_DATABASE: postgres://recql:recql@postgres:5432/recql
      RECQL_SEED: ${RECQL_SEED:-auto}
      RECQL_ENCODE: ${RECQL_ENCODE:-st}
      RECQL_DIMS: ${RECQL_DIMS:-384}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    volumes:
      - ./:/app
      - ${RECQL_CORE_PATH:-../recql-python-core}:/deps/core:ro
      - ${RECQL_CLI_PATH:-../recql-python-cli}:/deps/cli:ro
      - ${RECQL_POSTGRES_PATH:-../recql-python-postgres}:/deps/postgres:ro
      - ${RECQL_ORACLE_PATH:-../recql-python-oracle}:/deps/oracle:ro
      - ${RECQL_MARIADB_PATH:-../recql-python-mariadb}:/deps/mariadb:ro
      - ${RECQL_MONGODB_PATH:-../recql-python-mongodb}:/deps/mongodb:ro
      - ${RECQL_MSSQL_PATH:-../recql-python-mssql}:/deps/mssql:ro
      - ./docker/app/entrypoint.sh:/app/docker/app/entrypoint.sh:ro
      - recql_hf_cache:/cache/huggingface
    profiles: ["app", "postgres-app", "full"]
    stdin_open: true
    tty: true

  app-oracle:
    build: .
    image: recql-playground:local
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      RECQL_BACKEND: oracle
      RECQL_DATABASE: oracle://recql:${ORACLE_PWD:-RecqlPass1}@oracle:1521/FREEPDB1
      RECQL_SEED: ${RECQL_SEED:-auto}
      RECQL_ENCODE: ${RECQL_ENCODE:-st}
      RECQL_DIMS: ${RECQL_DIMS:-384}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    volumes:
      - ./:/app
      - ${RECQL_CORE_PATH:-../recql-python-core}:/deps/core:ro
      - ${RECQL_CLI_PATH:-../recql-python-cli}:/deps/cli:ro
      - ${RECQL_POSTGRES_PATH:-../recql-python-postgres}:/deps/postgres:ro
      - ${RECQL_ORACLE_PATH:-../recql-python-oracle}:/deps/oracle:ro
      - ${RECQL_MARIADB_PATH:-../recql-python-mariadb}:/deps/mariadb:ro
      - ${RECQL_MONGODB_PATH:-../recql-python-mongodb}:/deps/mongodb:ro
      - ${RECQL_MSSQL_PATH:-../recql-python-mssql}:/deps/mssql:ro
      - ./docker/app/entrypoint.sh:/app/docker/app/entrypoint.sh:ro
      - recql_hf_cache:/cache/huggingface
    profiles: ["app", "oracle-app", "full"]
    stdin_open: true
    tty: true

  app-mariadb:
    build: .
    image: recql-playground:local
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      RECQL_BACKEND: mariadb
      RECQL_DATABASE: mariadb://recql:${MARIADB_PWD:-recql}@mariadb:3306/recql
      RECQL_SEED: ${RECQL_SEED:-auto}
      RECQL_ENCODE: ${RECQL_ENCODE:-st}
      RECQL_DIMS: ${RECQL_DIMS:-384}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    volumes:
      - ./:/app
      - ${RECQL_CORE_PATH:-../recql-python-core}:/deps/core:ro
      - ${RECQL_CLI_PATH:-../recql-python-cli}:/deps/cli:ro
      - ${RECQL_POSTGRES_PATH:-../recql-python-postgres}:/deps/postgres:ro
      - ${RECQL_ORACLE_PATH:-../recql-python-oracle}:/deps/oracle:ro
      - ${RECQL_MARIADB_PATH:-../recql-python-mariadb}:/deps/mariadb:ro
      - ${RECQL_MONGODB_PATH:-../recql-python-mongodb}:/deps/mongodb:ro
      - ${RECQL_MSSQL_PATH:-../recql-python-mssql}:/deps/mssql:ro
      - ./docker/app/entrypoint.sh:/app/docker/app/entrypoint.sh:ro
      - recql_hf_cache:/cache/huggingface
    profiles: ["app", "mariadb-app", "full"]
    stdin_open: true
    tty: true

  app-mongodb:
    build: .
    image: recql-playground:local
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      RECQL_BACKEND: mongodb
      RECQL_DATABASE: mongodb://mongodb:27017/recql?directConnection=true
      RECQL_SEED: ${RECQL_SEED:-auto}
      RECQL_ENCODE: ${RECQL_ENCODE:-st}
      RECQL_DIMS: ${RECQL_DIMS:-384}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    volumes:
      - ./:/app
      - ${RECQL_CORE_PATH:-../recql-python-core}:/deps/core:ro
      - ${RECQL_CLI_PATH:-../recql-python-cli}:/deps/cli:ro
      - ${RECQL_POSTGRES_PATH:-../recql-python-postgres}:/deps/postgres:ro
      - ${RECQL_ORACLE_PATH:-../recql-python-oracle}:/deps/oracle:ro
      - ${RECQL_MARIADB_PATH:-../recql-python-mariadb}:/deps/mariadb:ro
      - ${RECQL_MONGODB_PATH:-../recql-python-mongodb}:/deps/mongodb:ro
      - ${RECQL_MSSQL_PATH:-../recql-python-mssql}:/deps/mssql:ro
      - ./docker/app/entrypoint.sh:/app/docker/app/entrypoint.sh:ro
      - recql_hf_cache:/cache/huggingface
    profiles: ["app", "mongodb-app", "full"]
    stdin_open: true
    tty: true

  app-mssql:
    build: .
    image: recql-playground:local
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      RECQL_BACKEND: mssql
      RECQL_DATABASE: mssql://sa:${MSSQL_SA_PASSWORD:-RecqlTest1234!}@mssql:1433/recql
      RECQL_SEED: ${RECQL_SEED:-auto}
      RECQL_ENCODE: ${RECQL_ENCODE:-st}
      RECQL_DIMS: ${RECQL_DIMS:-384}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    volumes:
      - ./:/app
      - ${RECQL_CORE_PATH:-../recql-python-core}:/deps/core:ro
      - ${RECQL_CLI_PATH:-../recql-python-cli}:/deps/cli:ro
      - ${RECQL_POSTGRES_PATH:-../recql-python-postgres}:/deps/postgres:ro
      - ${RECQL_ORACLE_PATH:-../recql-python-oracle}:/deps/oracle:ro
      - ${RECQL_MARIADB_PATH:-../recql-python-mariadb}:/deps/mariadb:ro
      - ${RECQL_MONGODB_PATH:-../recql-python-mongodb}:/deps/mongodb:ro
      - ${RECQL_MSSQL_PATH:-../recql-python-mssql}:/deps/mssql:ro
      - ./docker/app/entrypoint.sh:/app/docker/app/entrypoint.sh:ro
      - recql_hf_cache:/cache/huggingface
    profiles: ["app", "mssql-app", "full"]
    stdin_open: true
    tty: true

volumes:
  recql_pg_data:
  recql_oracle_data:
  recql_mariadb_data:
  recql_hf_cache:
