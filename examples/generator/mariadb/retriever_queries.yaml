# Explicit MariaDB retriever SQL for the MovieLens demo stack.
# Included by examples/generator/mariadb/engine.yaml and engine.st.yaml.

plugins:
  mariadb:
    queries:
      entity_list: |
        SELECT {item_select}
        FROM {item_from} e

      entity_filter: |
        SELECT {item_select}
        FROM {item_from} e
        WHERE ({where})
        LIMIT $limit

      entity_column_order: |
        SELECT {item_select}
        FROM {item_from} e
        WHERE ({where})
        ORDER BY {order_by}
        LIMIT $limit

      entity_column_order_open: |
        SELECT {item_select}
        FROM {item_from} e
        ORDER BY {order_by}
        LIMIT $limit

      entity_by_ids: |
        SELECT {item_select}
        FROM {item_from} e
        WHERE e.{id_column} IN ({id_in_list})
        ORDER BY FIELD(e.{id_column}, {id_field_list})

      interaction_items_for_user: |
        SELECT {item_id_column} AS item_id
        FROM {interaction_from}
        WHERE {user_id_column} = $entity_id

      personal_filter_ids: |
        SELECT {select_column} AS ban_id
        FROM {filter_from}
        WHERE {where_column} = $entity_id

index:
  lexical_search:
    queries:
      lexical_fulltext: |
        SELECT {item_select},
               MATCH(e.{search_text_column}) AGAINST ($query_text IN NATURAL LANGUAGE MODE) AS score
        FROM {item_from} e
        WHERE MATCH(e.{search_text_column}) AGAINST ($query_text IN NATURAL LANGUAGE MODE)
        ORDER BY score DESC
        LIMIT $limit

      lexical_like_fallback: |
        SELECT {item_select}, 0.1 AS score
        FROM {item_from} e
        WHERE UPPER(e.{search_text_column}) LIKE UPPER($query_text)
        ORDER BY score DESC
        LIMIT $limit

  embedding_stores:
    content_embedding:
      item:
        table: text_embeddings
        name_column: embedding_name
        entity_id_column: entity_id
        vector_column: embedding
        queries:
          embedding_vector_search: |
            SELECT entity_id, attrs, (1.0 - distance) AS score
            FROM (
              SELECT emb.{entity_id_column} AS entity_id, i.attrs,
                     VEC_DISTANCE_COSINE(emb.{vector_column}, VEC_FromText($query_vector)) AS distance
              FROM {emb_from} emb
              JOIN {item_from} i ON i.{id_column} = emb.{entity_id_column}
              WHERE {emb_filter}
              ORDER BY distance ASC
              LIMIT $limit
            ) AS _recql_vec

    title_embedding:
      item:
        table: text_embeddings
        name_column: embedding_name
        entity_id_column: entity_id
        vector_column: embedding
        queries:
          embedding_vector_search: |
            SELECT entity_id, attrs, (1.0 - distance) AS score
            FROM (
              SELECT emb.{entity_id_column} AS entity_id, i.attrs,
                     VEC_DISTANCE_COSINE(emb.{vector_column}, VEC_FromText($query_vector)) AS distance
              FROM {emb_from} emb
              JOIN {item_from} i ON i.{id_column} = emb.{entity_id_column}
              WHERE {emb_filter}
              ORDER BY distance ASC
              LIMIT $limit
            ) AS _recql_vec

    als:
      user:
        table: als_user_embeddings
        entity_id_column: user_id
        vector_column: embedding
        queries:
          embedding_lookup: |
            SELECT VEC_ToText(emb.{vector_column}) AS embedding
            FROM {emb_from} emb
            WHERE emb.{entity_id_column} = $entity_id

      item:
        table: als_item_embeddings
        entity_id_column: item_id
        vector_column: embedding
        queries:
          embedding_lookup: |
            SELECT VEC_ToText(emb.{vector_column}) AS embedding
            FROM {emb_from} emb
            WHERE emb.{entity_id_column} = $entity_id

          embedding_similarity_search: |
            SELECT entity_id, attrs, (1.0 - distance) AS score
            FROM (
              SELECT emb.{entity_id_column} AS entity_id, i.attrs,
                     VEC_DISTANCE_COSINE(emb.{vector_column}, VEC_FromText($query_vector)) AS distance
              FROM {emb_from} emb
              JOIN {item_from} i ON i.{id_column} = emb.{entity_id_column}
              WHERE TRUE
              ORDER BY distance ASC
              LIMIT $limit
            ) AS _recql_sim
